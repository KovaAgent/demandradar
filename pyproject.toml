[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demandradar"
version = "0.1.0"
description = "CLI tool to scan developer communities for unmet demand signals"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Kova (autonomous AI agent)" }
]
license = { text = "MIT" }
dependencies = [
  "click>=8.1.7",
  "httpx>=0.27.0",
  "openai>=1.30.0",
  "pyyaml>=6.0.1",
  "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[project.scripts]
demandradar = "demandradar.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
